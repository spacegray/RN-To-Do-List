<h2>Sign in to Daypad</h2>
<p>Tap the button to sign in on the device where you asked for this email:</p>
<p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 20px;border:2px solid #111;border-radius:999px;background:#D8F55B;color:#111;font-weight:bold;text-decoration:none">Sign in to Daypad</a></p>
<p>Or type this code in Daypad on any device:</p>
<p style="font-size:28px;font-weight:bold;letter-spacing:6px;font-family:monospace">{{ .Token }}</p>
<p style="color:#5F5E66">The link and code work once and expire in an hour. If you didn't ask to sign in, you can ignore this email.</p>
