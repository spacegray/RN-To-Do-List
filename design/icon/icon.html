<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&display=swap" rel="stylesheet">
<style>
*{margin:0}html,body{width:1024px;height:1024px;background:transparent}
.bg{position:absolute;inset:0;background:#FAF8F3;overflow:hidden;
 background-image:linear-gradient(rgba(17,17,17,.07) 3px,transparent 3px),linear-gradient(90deg,rgba(17,17,17,.07) 3px,transparent 3px);background-size:85px 85px}
.blob{position:absolute;width:760px;height:760px;right:-200px;top:-220px;border-radius:50%;filter:blur(90px);opacity:.85;
 background:radial-gradient(circle at 30% 30%,#FFB3D1,transparent 60%),radial-gradient(circle at 70% 60%,#4B2BFF,transparent 60%),radial-gradient(circle at 40% 85%,#FF5E57,transparent 60%)}
.pad{position:absolute;left:212px;top:212px;width:600px;height:600px;border-radius:150px;background:#fff;border:30px solid #111;box-sizing:border-box;box-shadow:34px 34px 0 #111;display:grid;place-items:center}
.ck{width:300px;height:300px;border-radius:84px;background:linear-gradient(135deg,#4B2BFF,#FF5E57);display:grid;place-items:center;color:#fff;font:800 230px/1 'Bricolage Grotesque'}
</style></head><body><div class="bg"><div class="blob"></div></div><div class="pad"><div class="ck">✓</div></div></body></html>
