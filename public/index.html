<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Daypad · tasks, calculator and notes</title>
    <meta name="description" content="Daypad keeps your tasks, a calculator with a running tape, and notes with reminders in one app. Built with React Native and Expo by Ayla Basha." />
    <meta property="og:title" content="Daypad · tasks, calculator and notes" />
    <meta property="og:description" content="Type tasks the way you say them, save a calculation to a note, and set reminders. Light and dark themes, offline, with a guided tour." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="color-scheme" content="light dark" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style id="expo-reset">
      html, body { height: 100%; }
      body { overflow: hidden; margin: 0; background: #FAF8F3; }
      @media (prefers-color-scheme: dark) { body { background: #0E0D14; } }
      body.preload { background: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
    <script>
      /* paint the saved hero gradient before the app loads, so the landing is the first thing seen */
      (function () {
        var fill = ['#F4ECDD', '#E3D3BC', '#C9B49A', '#A8957E'], dir = 'diag';
        try {
          var s = JSON.parse(localStorage.getItem('daypad.ui') || 'null');
          var f = s && s.state && s.state.heroFill;
          if (Array.isArray(f) && f.length >= 2 && f.every(function (c) { return /^#[0-9a-f]{3,8}$/i.test(c); })) fill = f;
          if (s && s.state && ['down', 'diag', 'across'].indexOf(s.state.heroDir) >= 0) dir = s.state.heroDir;
        } catch (e) {}
        var deg = dir === 'down' ? 180 : dir === 'across' ? 90 : 150;
        document.documentElement.style.background = 'linear-gradient(' + deg + 'deg,' + fill.join(',') + ')';
        document.documentElement.style.minHeight = '100%';
      })();
    </script>
  </head>
  <body class="preload">
    <noscript>Daypad needs JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
